<section class="contact" id="contact">
    <div class="container">
        <h2 class="h2">Contact Form</h2>

        <div class="contact__form">
            <form class="form">

                <div class="form__row form__row-1">
                    <div class="form__item form__item-from">
                        <select name="from" class="form__select">
                            <option value="Dubai">Dubai</option>
                            <option value="Istanbul">Istanbul</option>
                            <option value="Yerevan">Yerevan</option>
                            <option value="Larnaca">Larnaca</option>
                        </select>
                    </div>
                    <div class="form__item form__item-land">
                        <input class="form__input" type="text" name="land" placeholder="Riyadh" autocomplete="off">
                    </div>
                    <div class="form__item">
                        <input class="form__input cal" type="text" name="cal" placeholder="10-12 Aug">
                    </div>
                    <div class="form__item">
                        <input type="number" class="form__input" name="guests" id="guests2" value="1" min="1" >
                        <button type="button" class="minus">-</button>
                        <button type="button" class="plus">+</button>
                    </div>
                </div>

                <div class="form__row form__row-2">
                    <div class="form__item">
                        <input class="form__input" type="text" name="phone" placeholder="First name*" required>
                    </div>
                    <div class="form__item">
                        <input class="form__input" type="text" name="last" placeholder="Last name">
                    </div>
                    <div class="form__item">
                        <input class="form__input" type="email" name="email" placeholder="Email*" required>
                    </div>
                    <div class="form__item">
                        <input class="form__input" type="tel" name="phone" placeholder="Phone">
                    </div>
                </div>

                <div class="form__row form__row-3">
                    <div class="form__item d-flex">
                        <input type="checkbox" name="privacy" class="form__checkbox" id="privacy3">
                        <label for="privacy3" class="form__checkbox-text">Your personal data will be processed in accordance with our <a href="#">Privacy Notice</a></label>
                    </div>
                </div>

                <div class="form__adds">
                    <div class="form__row">
                        <div class="form__item d-flex">
                            <input type="checkbox" name="cons" class="form__checkbox" id="cons">
                            <label for="cons" class="form__checkbox-text">Concierge assistance required</label>
                        </div>
                    </div>

                    <div class="form__row form__row-5">
                        <div class="label">Communiction method</div>
                        <div class="form__item d-flex">
                            <input type="checkbox" name="tg" class="form__checkbox" id="tg">
                            <label for="tg" class="form__checkbox-text">Telegram</label>
                        </div>
                        <div class="form__item d-flex">
                            <input type="checkbox" name="wa" class="form__checkbox" id="wa">
                            <label for="wa" class="form__checkbox-text">WhatsApp</label>
                        </div>
                    </div>

                    <div class="form__row">
                        <div class="form__item">
                            <label for="message2">Additional request</label>
                            <textarea class="form__input" name="message" id="message2" placeholder="Enter text"></textarea>
                        </div>
                    </div>
                </div>

                <div class="form__row form__row-last">
                    <div class="form__btns">
                        <!-- <button type="submit" class="btn">Request a flight</button> -->
                        <button class="btn popup-link" type="button" data-src="#success">Request a flight</button>
                        <button type="button" class="btn btn-o btn-adds">Additional request</button>
                    </div>
                    <div class="form__contacts">
                        <div class="form__contact">
                            <div class="form__contact-name">Dubai</div>
                            <a class="form__contact-tel" href="tel:+971563808973">+971 56 380 8973</a>
                            <a href="#" class="btn-link" target="_blank"><span>Message on WhatsApp</span></a>
                        </div>
                        <div class="form__contact">
                            <div class="form__contact-name">Cyprus</div>
                            <a class="form__contact-tel" href="tel:+971563808973">+971 56 380 8973</a>
                            <a href="#" class="btn-link" target="_blank"><span>Message on WhatsApp</span></a>
                        </div>
                    </div>
                </div>

            </form>
        </div>

    </div>
</section>
