<div style="display: none;" class="popup" id="discover">
    <div class="popup__title">Discover our services</div>
    <form class="form popup__form">
        <div class="form__row">
            <input class="form__input" type="tel" name="phone" placeholder="Phone">
            <input class="form__input" type="text" name="last" placeholder="Last name">
            <input class="form__input" type="email" name="email" placeholder="Email*" required>
            <input class="form__input" type="text" name="phone" placeholder="First name*" required>
        </div>
        <div class="form__row">
            <div class="form__item">
                <label for="message1">Any additional requests that we may assist you with?</label>
                <textarea class="form__input" name="message" id="message1" placeholder="Enter text"></textarea>
            </div>
        </div>
        <!-- <button class="btn" type="submit">Submit</button> -->
         <button class="btn popup-link" type="button" data-src="#success">Submit</button>
    </form>
</div>

<div style="display: none;" class="popup" id="discuss">
    <div class="popup__title">Discuss Your Flight Requirements</div>
    <form class="form popup__form">
        <div class="form__row">
            <input class="form__input" type="tel" name="phone" placeholder="Phone">
            <input class="form__input" type="text" name="last" placeholder="Last name">
            <input class="form__input" type="email" name="email" placeholder="Email*" required>
            <input class="form__input" type="text" name="phone" placeholder="First name*" required>
        </div>
        <div class="form__row">
            <div class="form__item">
                <label for="message2">Message</label>
                <textarea class="form__input" name="message" id="message2" placeholder="Enter text"></textarea>
            </div>
        </div>
        <!-- <button class="btn" type="submit">Submit</button> -->
        <button class="btn popup-link" type="button" data-src="#success">Submit</button>
    </form>
</div>

<div style="display: none;" class="popup" id="success">
    <div class="popup__form tac">
        <div class="popup__title">Request received</div>
        <div class="popup__subtitle">Thank you for your request. Your personal flight advisor will contact you shortly to confirm the details and prepare a tailored offer.</div>
        <a href="#" class="btn" onclick="$.fancybox.close(); return false;">Close</a>
    </div>
</div>
