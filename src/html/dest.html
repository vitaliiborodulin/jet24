<section class="dest" id="dest">
    <div class="container">

        <div class="dest__content">

            <div class="dest__list">

                <div class="dest__item">
                    <div class="dest__text">
                        <div class="dest__subtitle">Popular Destinations</div>
                        <div class="dest__title">Dubai</div>
                    </div>
                    <picture class="dest__pic">
                        <source srcset="img/Dubai-mobile-01.png" media="(max-width: 768px)">
                        <img src="img/Dubai-desktop-01.png" alt="">
                    </picture>
                </div>

                <div class="dest__item">
                    <div class="dest__text">
                        <div class="dest__subtitle">Popular Destinations</div>
                        <div class="dest__title">Larnaca</div>
                    </div>
                    <picture class="dest__pic">
                        <source srcset="img/Larnaca-mobile-01.png" media="(max-width: 768px)">
                        <img src="img/Larnaca-desktop-01.png" alt="">
                    </picture>
                </div>

                <div class="dest__item">
                    <div class="dest__text">
                        <div class="dest__subtitle">Popular Destinations</div>
                        <div class="dest__title">Yerevan</div>
                    </div>
                    <picture class="dest__pic">
                        <source srcset="img/Yerevan-mobile-01.png" media="(max-width: 768px)">
                        <img src="img/Yerevan-desktop-01.png" alt="">
                    </picture>
                </div>

                <div class="dest__item">
                    <div class="dest__text">
                        <div class="dest__subtitle">Popular Destinations</div>
                        <div class="dest__title">Istanbul</div>
                    </div>
                    <picture class="dest__pic">
                        <source srcset="img/Istanbul-mobile-01.png" media="(max-width: 768px)">
                        <img src="img/Istanbul-desktop-01.png" alt="">
                    </picture>
                </div>

            </div>

            <div class="arrows">
                <div class="arrow arrow-o arrow-prev">Prev</div>
                <div class="arrow arrow-o arrow-next">Next</div>
            </div>

            <div class="form__box">
                <form class="form form__row form__row-1" method="post">

                    <div class="form__item form__item-from">
                        <label for="takeoff2">From</label>
                        <select name="from" id="takeoff2" class="form__select">
                            <option value="Dubai">Dubai</option>
                            <option value="Istanbul">Istanbul</option>
                            <option value="Yerevan">Yerevan</option>
                            <option value="Larnaca">Larnaca</option>
                        </select>
                    </div>

                    <div class="form__item form__item-land">
                        <label for="land2">To</label>
                        <input class="form__input" type="text" name="land" id="land2" placeholder="Riyadh" autocomplete="off">
                    </div>

                    <div class="form__item">
                        <label for="cal2">Date</label>
                        <input class="form__input cal" type="text" name="cal" id="cal2" placeholder="10-12 Aug">
                    </div>

                    <div class="form__item">
                        <label for="guests2">Passengers</label>
                        <input type="number" class="form__input" name="guests" id="guests2" value="1" min="1" >
                        <button type="button" class="minus">-</button>
                        <button type="button" class="plus">+</button>
                    </div>
                    
                    <!-- <button class="btn form__submit" type="submit">Request a flight</button> -->
                     <button class="btn form__submit popup-link" type="button" data-src="#discuss">Request a flight</button>
                </form>
            </div>

        </div>

    </div>
</section>
