<section class="hero">
    <div class="container"> 
        <div class="hero__content">

            <h1 class="h1">The Private Way <span class="accent">to Fly</span></h1>
            <div class="hero__descr">Charter flights, aircraft management and exclusive aviation services worldwide.</div>

            <div class="hero__obj-entry">
                <picture>
                    <source srcset="img/hero-aircraft.webp" type="image/webp">
                    <img class="hero__obj" src="img/hero-aircraft.png" width="1300" height="290" fetchpriority="high" alt="JET24 private jet in flight">
                </picture>
            </div>

            <div class="form__box">
                <form class="form form__row form__row-1" method="post">

                    <div class="form__item form__item-from">
                        <label for="takeoff1">From</label>
                        <select name="from" id="takeoff1" class="form__select">
                            <option value="Dubai">Dubai</option>
                            <option value="Istanbul">Istanbul</option>
                            <option value="Yerevan">Yerevan</option>
                            <option value="Larnaca">Larnaca</option>
                        </select>
                    </div>

                    <div class="form__item form__item-land">
                        <label for="land1">To</label>
                        <input class="form__input" type="text" name="land" id="land1" placeholder="Riyadh" autocomplete="off">
                    </div>

                    <div class="form__item">
                        <label for="cal1">Date</label>
                        <input class="form__input cal" type="text" name="cal" id="cal1" placeholder="10-12 Aug">
                    </div>

                    <div class="form__item">
                        <label for="guests1">Passengers</label>
                        <input type="number" class="form__input" name="guests" id="guests1" value="1" min="1" >
                        <button type="button" class="minus">-</button>
                        <button type="button" class="plus">+</button>
                    </div>
                    
                    <!-- <button class="btn form__submit" type="submit">Request a flight</button> -->
                    <button class="btn form__submit popup-link" type="button" data-src="#discuss">Request a flight</button>
                </form>
            </div>

            
        </div>
    </div>
    <!-- <img class="hero__clouds" src="img/clouds.png" alt=""> -->
</section>
